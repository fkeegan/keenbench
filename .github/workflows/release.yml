name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  github-release:
    name: github-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: engine/go.mod

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            libgtk-3-dev \
            liblzma-dev \
            ninja-build \
            pkg-config

      - name: Enable Flutter Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Build Linux AppImage
        run: |
          make package-linux-appimage

      - name: Create AppImage checksums
        run: |
          set -euo pipefail
          for appimage in dist/KeenBench-linux-*.AppImage; do
            if [[ ! -f "$appimage" ]]; then
              echo "ERROR: expected AppImage artifact not found under dist/" >&2
              exit 1
            fi
            sha256sum "$appimage" > "$appimage.sha256"
          done

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/KeenBench-linux-*.AppImage
            dist/KeenBench-linux-*.AppImage.sha256
          fail_on_unmatched_files: true
